name: Docker Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild without cache'
        required: false
        default: 'false'
        type: boolean

jobs:
  deploy:
    runs-on: self-hosted
    env:
      APP_ENV: ${{ secrets.APP_ENV }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── PostgreSQL 15 → 18 migration (dump phase) ──────────────────────
      # Checks the existing data volume for PG 15 data. If found, spins up
      # a temporary PG 15 container to dump the database, then removes the
      # incompatible volume so PG 18 can start fresh.
      - name: "Migrate PostgreSQL 15 \u2192 18 (dump phase)"
        id: pg_migrate
        run: |
          set -euo pipefail

          PG_VOLUME=$(docker volume ls -q --filter "name=postgres_data" | head -1)

          if [ -z "$PG_VOLUME" ]; then
            echo "No postgres_data volume found — fresh install, skipping migration."
            echo "needs_restore=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found volume: $PG_VOLUME"

          # Read PG major version from the data directory
          PG_DATA_VERSION=$(docker run --rm -v "$PG_VOLUME":/pgdata alpine cat /pgdata/PG_VERSION 2>/dev/null || echo "")
          echo "Data directory PG_VERSION: ${PG_DATA_VERSION:-empty}"

          if [ "$PG_DATA_VERSION" != "15" ]; then
            echo "Volume is not PG 15 (version: ${PG_DATA_VERSION:-unknown}). No migration needed."
            echo "needs_restore=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::group::PostgreSQL 15 → 18 migration — dump"

          # Stop any running/broken containers first
          docker compose down --remove-orphans 2>/dev/null || true

          # Spin up a temporary PG 15 container with the old data volume
          docker run -d --name pg_migrate_src \
            -v "$PG_VOLUME":/var/lib/postgresql/data \
            -e POSTGRES_PASSWORD="${DB_PASSWORD:-mvc_password}" \
            postgres:15-alpine

          echo "Waiting for temporary PG 15 container..."
          for i in $(seq 1 30); do
            if docker exec pg_migrate_src pg_isready -U "${DB_USER:-mvc_user}" 2>/dev/null; then
              echo "PG 15 is ready."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Temporary PG 15 failed to start within 60s"
              docker logs pg_migrate_src
              docker stop pg_migrate_src && docker rm pg_migrate_src || true
              exit 1
            fi
            sleep 2
          done

          # Dump the database (full schema + data)
          echo "Dumping ${DB_NAME:-mvc_db}..."
          docker exec pg_migrate_src pg_dump \
            -U "${DB_USER:-mvc_user}" \
            -d "${DB_NAME:-mvc_db}" \
            > /tmp/pg_migration_dump.sql

          DUMP_SIZE=$(wc -c < /tmp/pg_migration_dump.sql | tr -d ' ')
          echo "Dump size: ${DUMP_SIZE} bytes"

          if [ "$DUMP_SIZE" -lt 100 ]; then
            echo "::error::Dump is suspiciously small (${DUMP_SIZE} bytes). Aborting to protect data."
            docker stop pg_migrate_src && docker rm pg_migrate_src || true
            rm -f /tmp/pg_migration_dump.sql
            exit 1
          fi

          # Tear down the temporary container and remove the old volume
          docker stop pg_migrate_src && docker rm pg_migrate_src
          docker volume rm "$PG_VOLUME"
          echo "Old PG 15 volume removed."

          echo "needs_restore=true" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Verify environment configuration
        run: |
          echo "=== Environment Configuration ==="
          echo "Environment variables are loaded from GitHub Secrets"
          echo "APP_ENV: ${APP_ENV:-not set, will use default}"
          echo "DB_HOST: ${DB_HOST:-not set, will use default}"
          echo "DB_NAME: ${DB_NAME:-not set, will use default}"
          echo "DB_USER: ${DB_USER:-not set, will use default}"
          echo "Note: Sensitive values (passwords) are not displayed"

      - name: Build Docker images
        run: |
          if [ "${{ github.event.inputs.force_rebuild }}" == "true" ]; then
            docker compose build --no-cache
          else
            docker compose build
          fi

      - name: Stop existing containers
        run: |
          docker compose down --remove-orphans || true

      # ── Start database first when migrating ────────────────────────────
      # On a fresh volume PG 18 runs docker-entrypoint-initdb.d scripts
      # (init.sql + seed). We start db alone so we can drop-and-restore
      # before the app tries to connect.
      - name: Start database for migration
        if: steps.pg_migrate.outputs.needs_restore == 'true'
        run: |
          docker compose up -d db

          echo "Waiting for PG 18 to accept connections..."
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U "${DB_USER:-mvc_user}" 2>/dev/null; then
              echo "PG 18 is ready."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::PG 18 failed to become ready within 60s"
              docker compose logs db
              exit 1
            fi
            sleep 2
          done

      # ── PostgreSQL 15 → 18 migration (restore phase) ───────────────────
      # Drops the schema that init.sql created on the fresh volume, then
      # restores the full dump captured from PG 15.
      - name: "Migrate PostgreSQL 15 \u2192 18 (restore phase)"
        if: steps.pg_migrate.outputs.needs_restore == 'true'
        run: |
          set -euo pipefail
          echo "::group::PostgreSQL 15 → 18 migration — restore"

          # Drop the schema that init.sql just created on the fresh volume
          echo "Dropping init.sql schema..."
          docker compose exec -T db psql \
            -U "${DB_USER:-mvc_user}" \
            -d "${DB_NAME:-mvc_db}" \
            -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO PUBLIC;"

          # Restore the PG 15 dump into PG 18
          echo "Restoring dump into PG 18..."
          docker compose exec -T db psql \
            -U "${DB_USER:-mvc_user}" \
            -d "${DB_NAME:-mvc_db}" \
            < /tmp/pg_migration_dump.sql

          # Verify the restore
          TABLE_COUNT=$(docker compose exec -T db psql \
            -U "${DB_USER:-mvc_user}" \
            -d "${DB_NAME:-mvc_db}" \
            -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';")
          PG_VERSION=$(docker compose exec -T db psql \
            -U "${DB_USER:-mvc_user}" \
            -d "${DB_NAME:-mvc_db}" \
            -tAc "SHOW server_version;")

          echo "PostgreSQL version: $PG_VERSION"
          echo "Tables restored: ${TABLE_COUNT// /}"

          if [ "${TABLE_COUNT// /}" -lt 5 ]; then
            echo "::warning::Only ${TABLE_COUNT// /} tables found — expected more. Review restore output above."
          fi

          rm -f /tmp/pg_migration_dump.sql
          echo "::endgroup::"
          echo "PostgreSQL 15 → 18 migration complete."

      - name: Start all services
        run: |
          docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          sleep 10

          # Check if containers are running
          if docker compose ps | grep -q "Up"; then
            echo "Containers are running successfully"
          else
            echo "Error: Containers failed to start"
            docker compose logs
            exit 1
          fi

      - name: Cleanup old Docker images
        run: |
          # Remove dangling images to free up space
          docker image prune -f || true

      - name: Deployment summary
        run: |
          echo "=== Deployment Complete ==="
          echo ""
          echo "Running containers:"
          docker compose ps
          echo ""
          echo "Container logs (last 20 lines each):"
          echo "--- App container ---"
          docker logs h3x_app --tail 20 2>&1 || true
          echo ""
          echo "--- Nginx container ---"
          docker logs h3x_nginx --tail 20 2>&1 || true
