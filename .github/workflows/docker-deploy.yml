name: Docker Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild without cache'
        required: false
        default: 'false'
        type: boolean

jobs:
  deploy:
    runs-on: self-hosted
    env:
      APP_ENV: ${{ secrets.APP_ENV }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── PostgreSQL 15 → 18 in-place upgrade ─────────────────────────────
      # Uses pgautoupgrade to run pg_upgrade directly on the data volume.
      # No dump/restore needed — converts the data directory in-place.
      - name: "Migrate PostgreSQL 15 \u2192 18"
        run: |
          set -euo pipefail

          PG_VOLUME=$(docker volume ls -q --filter "name=postgres_data" | head -1)

          if [ -z "$PG_VOLUME" ]; then
            echo "No postgres_data volume found — fresh install, skipping migration."
            exit 0
          fi

          PG_DATA_VERSION=$(docker run --rm -v "$PG_VOLUME":/pgdata alpine cat /pgdata/PG_VERSION 2>/dev/null || echo "")
          echo "Data directory PG_VERSION: ${PG_DATA_VERSION:-empty}"

          if [ "$PG_DATA_VERSION" != "15" ]; then
            echo "Not PG 15 (version: ${PG_DATA_VERSION:-unknown}). No migration needed."
            exit 0
          fi

          echo "PG 15 data detected. Running in-place upgrade to PG 18..."
          docker compose down --remove-orphans 2>/dev/null || true

          docker run --rm \
            -v "$PG_VOLUME":/var/lib/postgresql/data \
            -e POSTGRES_USER="${DB_USER:-mvc_user}" \
            -e POSTGRES_PASSWORD="${DB_PASSWORD:-mvc_password}" \
            -e POSTGRES_DB="${DB_NAME:-mvc_db}" \
            pgautoupgrade/pgautoupgrade:18-alpine

          UPGRADED_VERSION=$(docker run --rm -v "$PG_VOLUME":/pgdata alpine cat /pgdata/PG_VERSION 2>/dev/null || echo "")
          echo "Post-upgrade PG_VERSION: $UPGRADED_VERSION"

          if [ "$UPGRADED_VERSION" != "18" ]; then
            echo "::error::Expected PG_VERSION 18 after upgrade, got: $UPGRADED_VERSION"
            exit 1
          fi

          echo "PostgreSQL 15 → 18 in-place upgrade complete."

      - name: Verify environment configuration
        run: |
          echo "=== Environment Configuration ==="
          echo "Environment variables are loaded from GitHub Secrets"
          echo "APP_ENV: ${APP_ENV:-not set, will use default}"
          echo "DB_HOST: ${DB_HOST:-not set, will use default}"
          echo "DB_NAME: ${DB_NAME:-not set, will use default}"
          echo "DB_USER: ${DB_USER:-not set, will use default}"
          echo "Note: Sensitive values (passwords) are not displayed"

      - name: Build Docker images
        run: |
          if [ "${{ github.event.inputs.force_rebuild }}" == "true" ]; then
            docker compose build --no-cache
          else
            docker compose build
          fi

      - name: Stop existing containers
        run: |
          docker compose down --remove-orphans || true

      - name: Start new containers
        run: |
          docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          sleep 10

          # Check if containers are running
          if docker compose ps | grep -q "Up"; then
            echo "Containers are running successfully"
          else
            echo "Error: Containers failed to start"
            docker compose logs
            exit 1
          fi

      - name: Cleanup old Docker images
        run: |
          # Remove dangling images to free up space
          docker image prune -f || true

      - name: Deployment summary
        run: |
          echo "=== Deployment Complete ==="
          echo ""
          echo "Running containers:"
          docker compose ps
          echo ""
          echo "Container logs (last 20 lines each):"
          echo "--- App container ---"
          docker logs h3x_app --tail 20 2>&1 || true
          echo ""
          echo "--- Nginx container ---"
          docker logs h3x_nginx --tail 20 2>&1 || true
